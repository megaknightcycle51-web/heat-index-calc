<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heat Index Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Heat Index Calculator</h1>
        
        <div class="input-section">
            <div class="input-group">
                <label for="temperature">Temperature (°C):</label>
                <input type="number" id="temperature" placeholder="Enter temperature" step="0.1">
            </div>
            
            <div class="input-group">
                <label for="humidity">Humidity (%):</label>
                <input type="number" id="humidity" placeholder="Enter humidity" min="0" max="100" step="0.1">
            </div>
            
            <button class="btn-calculate">Calculate Heat Index</button>
        </div>
        
        <div class="result-section" id="resultSection" style="display: none;">
            <div class="result-box" id="resultBox">
                <p class="result-label">Heat Index:</p>
                <p class="result-value" id="resultValue">--°C</p>
                <p class="result-warning" id="resultWarning"></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
